<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Surgery Billing Calculator | Mira Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f7f3;            /* Mira warm cream ground */
  --card:#ffffff;
  --ink:#1a202c;
  --navy:#003053;          /* Mira brand ink */
  --navy-soft:#e0ecff;     /* ICD-pill blue tint */
  --gold:#B08D57;          /* Mira warm gold */
  --border:#eceae5;
  --border-strong:#e2e8f0;
  --muted:#64748b;
  --faint:#94a3b8;
  --pill-bg:#f0f4f8;       /* CPT pill */
  --warn-bg:#fef6e9;
  --warn-edge:#c17817;
  --warn-ink:#7a5314;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:1.5rem;min-height:100vh;line-height:1.5}
#wrap{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2.25rem 2.25rem 2rem;box-shadow:0 1px 3px rgba(0,48,83,.06)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h1{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:700;color:var(--navy);margin-bottom:4px;letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:1.6rem;line-height:1.55}
.qlabel{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.5}
.qhint{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.55}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.btn{background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.45;text-align:left;font-family:inherit;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--navy);background:#f8fafb}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btn.on{border:2px solid var(--navy);background:var(--navy-soft);color:var(--navy)}
.cbtn{background:var(--navy);border:none;border-radius:var(--radius);padding:10px 22px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;margin-top:4px;font-family:inherit}
.cbtn:hover{background:#00426e}
.panel{background:#f8fafb;border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-top:1rem;margin-bottom:.5rem}
.panel h3{font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.cpt{font-size:12px;font-weight:600;font-family:ui-monospace,'SF Mono',Menlo,monospace;white-space:nowrap;color:var(--navy);background:var(--pill-bg);border:1px solid var(--border-strong);border-radius:6px;padding:2px 7px;min-width:58px;text-align:center}
.desc{font-size:12.5px;color:var(--muted);flex:1;padding-top:1px}
.wrvu{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border-strong);border-left:3px solid var(--gold);border-radius:var(--radius);padding:10px 16px;margin-bottom:.75rem}
.tlabel{font-size:13px;color:var(--muted)}
.tval{font-size:19px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.warn{font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:9px 13px;margin-bottom:6px;line-height:1.55;border-left:3px solid var(--warn-edge)}
.back{font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;margin-bottom:.85rem;text-decoration:underline;font-family:inherit;display:block}
.back:hover{color:var(--navy)}
.prog{font-size:12px;color:var(--faint);margin-bottom:.85rem}
.note{font-size:11px;color:var(--faint);margin-top:1.2rem;line-height:1.65;border-top:1px solid var(--border);padding-top:1rem}
.restart{background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius);padding:7px 16px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.restart:hover{border-color:var(--navy);color:var(--navy)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
h1.done-title{font-size:22px;margin-bottom:1rem}
@media(max-width:520px){.cat-grid{grid-template-columns:1fr}#wrap{padding:1.5rem 1.25rem}}
</style>
</head>
<body>
<div id="wrap">
<p class="eyebrow">Mira Health</p>
<h1>Spine Surgery Billing Calculator</h1>
<p class="sub">CPT coding with CMS 2026 wRVU rates (non-QPP conversion factor $33.40).<br>Answer each question to build your billable code list.</p>
<div id="root"></div>
</div>
<script>
var CF = 33.40;

// wRVUs verified against CMS 2026 PFS RVU file (PPRRVU2026).
var DB = {
  22551:{d:'ACDF with discectomy/decompression, single level',w:24.38},
  22552:{d:'ACDF each additional interspace (add-on)',w:6.34,ao:1},
  22554:{d:'ACDF with minimal discectomy, single level',w:17.25},
  22856:{d:'Cervical total disc arthroplasty, single level',w:23.45},
  22858:{d:'Cervical TDA second level (add-on)',w:8.19,ao:1},
  22861:{d:'Revision cervical total disc arthroplasty',w:32.53},
  22845:{d:'Anterior instrumentation 2-3 segments (add-on)',w:11.64,ao:1},
  22849:{d:'Reinsertion of spinal fixation device (includes removal of the prior device)',w:18.69},
  22850:{d:'Removal of posterior NON-segmental instrumentation (e.g. Harrington rod)',w:9.57},
  22852:{d:'Removal of posterior SEGMENTAL instrumentation',w:9.14},
  22855:{d:'Removal of ANTERIOR instrumentation (anterior cervical/thoracic/lumbar plate or rod)',w:15.46},
  22853:{d:'Insertion of interbody biomechanical device (cage/spacer) with integral anterior instrumentation, each INTERSPACE (add-on)',w:4.14,ao:1},
  22854:{d:'Insertion of intervertebral biomechanical device (cage/mesh) into a vertebral CORPECTOMY DEFECT, each defect (add-on)',w:5.36,ao:1},
  22830:{d:'Exploration of spinal fusion, no new fusion',w:10.94},
  22595:{d:'Posterior fusion C1-C2',w:20.12},
  22590:{d:'Craniocervical fusion occiput to C2',w:21.22},
  22600:{d:'Posterior cervical fusion, single interspace',w:16.97},
  22614:{d:'Each additional interspace posterior/posterolateral fusion (add-on)',w:6.27,ao:1},
  63001:{d:'Cervical laminectomy 1-2 segments, without facetectomy/foraminotomy',w:17.17},
  63020:{d:'Cervical laminotomy/foraminotomy single interspace',w:14.54},
  63050:{d:'Cervical laminoplasty 2+ segments, without reconstruction of the posterior bony elements',w:21.46},
  63051:{d:'Cervical laminoplasty 2+ segments, WITH reconstruction of the posterior bony elements (plates/spacers) — standalone alternative to 63050, not an add-on',w:24.87},
  63015:{d:'Cervical laminectomy, more than 2 segments, without facetectomy/foraminotomy',w:20.33},
  63081:{d:'Vertebral corpectomy, anterior cervical approach, single segment',w:25.45},
  63082:{d:'Each additional cervical corpectomy segment (add-on)',w:4.25,ao:1},
  22326:{d:'Open treatment cervical vertebral fracture posterior',w:20.32},
  22328:{d:'Each additional fractured vertebra (add-on)',w:4.49,ao:1},
  22840:{d:'Posterior non-segmental instrumentation (add-on)',w:12.21,ao:1},
  22842:{d:'Posterior segmental instrumentation 3-6 segments (add-on)',w:12.25,ao:1},
  22843:{d:'Posterior segmental instrumentation 7-12 segments (add-on)',w:13.10,ao:1},
  22844:{d:'Posterior segmental instrumentation 13+ segments (add-on)',w:16.01,ao:1},
  22558:{d:'Anterior lumbar interbody fusion ALIF/LLIF/XLIF/OLIF single interspace',w:22.94},
  22585:{d:'Each additional interspace anterior interbody (add-on)',w:5.38,ao:1},
  22586:{d:'Pre-sacral interbody L5-S1 AxiaLIF with instrumentation',w:27.42},
  22846:{d:'Anterior instrumentation 4-7 segments (add-on)',w:12.09,ao:1},
  22847:{d:'Anterior instrumentation 8 or more segments (add-on)',w:13.44,ao:1},
  22857:{d:'Lumbar total disc arthroplasty single level',w:26.45},
  22862:{d:'Revision lumbar total disc arthroplasty',w:31.81},
  22556:{d:'Anterior thoracic interbody fusion single interspace',w:24.08},
  22532:{d:'Arthrodesis, lateral extracavitary technique, thoracic, single segment',w:25.34},
  22533:{d:'Arthrodesis, lateral extracavitary technique, lumbar, single segment',w:24.17},
  22534:{d:'Lateral extracavitary arthrodesis, each additional segment (add-on)',w:5.84,ao:1},
  63085:{d:'Vertebral corpectomy, transthoracic approach, thoracic, single segment',w:28.73},
  63086:{d:'Each additional segment, transthoracic corpectomy (add-on to 63085)',w:3.11,ao:1},
  63087:{d:'Vertebral corpectomy, COMBINED thoracolumbar approach (anterior + posterior/retroperitoneal in one session), lower thoracic or lumbar, single segment',w:36.59},
  63088:{d:'Each additional segment, combined thoracolumbar corpectomy (add-on to 63087)',w:4.21,ao:1},
  // 22851 removed from CMS 2026 PFS - cage after corpectomy now billed as 22853
  63005:{d:'Lumbar laminectomy 1-2 segments, without facetectomy/foraminotomy',w:16.02},
  63012:{d:'Lumbar laminectomy spondylolisthesis with CES',w:16.43},
  63017:{d:'Lumbar laminectomy 3+ segments, without facetectomy/foraminotomy',w:16.90},
  63045:{d:'Laminectomy with facetectomy and foraminotomy, cervical, single segment',w:17.50},
  63046:{d:'Laminectomy with facetectomy and foraminotomy, thoracic, single segment',w:16.82},
  63047:{d:'Laminectomy with facetectomy and foraminotomy, lumbar, single segment',w:14.99},
  63048:{d:'Each additional segment, laminectomy with facetectomy/foraminotomy (add-on to 63045-63047)',w:3.38,ao:1},
  63052:{d:'Laminectomy/facetectomy/foraminotomy at the SAME interspace as posterior interbody fusion, single interspace (add-on to 22630/22633)',w:4.14,ao:1},
  63053:{d:'Same-interspace decompression with interbody fusion, each additional interspace (add-on to 63052)',w:3.69,ao:1},
  63030:{d:'Lumbar microdiscectomy/laminotomy single interspace',w:11.70},
  63032:{d:'Annular defect closure device placed at the time of lumbar discectomy, each interspace (add-on)',w:2.50,ao:1},
  63035:{d:'Each additional interspace laminotomy/microdiscectomy, cervical or lumbar (add-on)',w:3.76,ao:1},
  63042:{d:'Revision lumbar microdiscectomy',w:18.29},
  63265:{d:'Laminectomy for extradural tumor thoracic',w:23.22},
  63267:{d:'Laminectomy for extradural tumor lumbar',w:18.96},
  22630:{d:'Posterior interbody fusion PLIF/TLIF single interspace',w:21.54},
  22632:{d:'Each additional interspace posterior interbody fusion (add-on)',w:5.09,ao:1},
  22633:{d:'Combined posterior interbody + posterolateral fusion single interspace',w:26.13},
  22634:{d:'Each additional interspace combined fusion (add-on)',w:7.76,ao:1},
  22610:{d:'Posterolateral fusion thoracic single interspace',w:16.85},
  22612:{d:'Posterolateral fusion lumbar single interspace',w:22.94},
  22800:{d:'Posterior arthrodesis for spinal deformity, up to 6 vertebral segments',w:19.01},
  22802:{d:'Posterior arthrodesis for spinal deformity, 7-12 vertebral segments',w:31.31},
  22804:{d:'Posterior arthrodesis for spinal deformity, 13+ vertebral segments',w:36.56},
  22848:{d:'Pelvic fixation (iliac/sacropelvic anchors) other than sacrum (add-on)',w:5.84,ao:1},
  22210:{d:'Osteotomy posterior cervical single vertebra',w:24.75},
  22212:{d:'Osteotomy posterior thoracic single vertebra',w:20.47},
  22214:{d:'Osteotomy posterior lumbar PSO single vertebra',w:20.49},
  22216:{d:'Each additional vertebra osteotomy (add-on)',w:5.88,ao:1},
  61783:{d:'Stereotactic spinal navigation (add-on)',w:3.66,ao:1},
  20930:{d:'Allograft morselized bone chips (add-on) — $0 Medicare wRVU; submit to commercial payers',w:0.00,ao:1},
  20931:{d:'Allograft structural cortical ring/dowel (add-on)',w:1.76,ao:1},
  20936:{d:'Autograft local same incision (add-on) — $0 Medicare wRVU; submit to commercial payers',w:0.00,ao:1},
  20937:{d:'Autograft morselized separate incision ICBG (add-on)',w:2.72,ao:1},
  20938:{d:'Autograft structural separate incision ICBG (add-on)',w:2.94,ao:1},
  20939:{d:'Bone marrow aspiration separate incision (add-on)',w:1.13,ao:1},
  27279:{d:'Arthrodesis SI joint MIS lateral transfixing implant',w:11.83},
  27280:{d:'Arthrodesis SI joint open posterior approach',w:19.50},
};

var GRAFTS = [
  {id:'g1',label:'Structural allograft — cortical ring/dowel (+20931)',codes:['20931']},
  {id:'g2',label:'Morselized allograft — bone chips (+20930, $0 Medicare / may pay commercial)',codes:['20930']},
  {id:'g3',label:'Local autograft same incision (+20936, $0 Medicare / may pay commercial)',codes:['20936']},
  {id:'g4',label:'Iliac crest morselized autograft separate incision (+20937)',codes:['20937']},
  {id:'g5',label:'Iliac crest structural autograft separate incision (+20938)',codes:['20938']},
  {id:'g6',label:'Bone marrow aspiration separate needle site (+20939)',codes:['20939']},
  {id:'g0',label:'No bone graft / graft integral to implant',codes:[]},
];

// ── State ──────────────────────────────────────────────────────────────────
var S = newState();
function newState(){
  return {step:'cat', cat:'', codes:[], warns:[], hist:[], gsel:[], graftNext:'', lvl:0, plAsked:false};
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function save(){ S.hist.push(clone(S)); }
function back(){
  if(!S.hist.length) return;
  S = S.hist.pop();
  draw();
}

function addC(id){ S.codes.push(''+id); }
function addN(id,n){ for(var i=0;i<n;i++) S.codes.push(''+id); }
function remC(id){ var i=S.codes.indexOf(''+id); if(i>=0) S.codes.splice(i,1); }
function remAll(id){ while(S.codes.indexOf(''+id) >= 0) remC(id); }
function warn(m){ if(!S.warns.includes(m)) S.warns.push(m); }
function has(id){ return S.codes.indexOf(''+id) >= 0; }
function addOnce(id){ if(!has(id)) S.codes.push(''+id); }

// ── Claim-level guards ─────────────────────────────────────────────────────
// 22800-22804 already span EVERY vertebral segment of the deformity construct,
// so they are not valid parents for +22614 (H4).
function hasDeformityPrimary(){ return has('22800') || has('22802') || has('22804'); }
// +63052/+63053 are add-ons to posterior interbody arthrodesis only (H5).
function hasInterbodyPrimary(){ return has('22630') || has('22633'); }
function hasAnyFusionPrimary(){
  return ['22610','22612','22630','22633','22800','22802','22804','22532','22533','22556','22558','22586','22595','22590','22600'].some(has);
}

// +22614 = each ADDITIONAL interspace on a posterior/posterolateral arthrodesis.
// Refused outright on deformity claims (H4).
function addExtraInterspace(n){
  if(hasDeformityPrimary()){
    warn('+22614 was NOT added. 22800/22802/22804 (posterior arthrodesis for spinal DEFORMITY) are level-span codes — the segment count in the code descriptor already covers every vertebral segment of the construct, so they are not valid parent codes for +22614. Reporting +22614 with 22800-22804 double-counts the same levels and is a routine post-payment audit takeback. If additional levels were fused OUTSIDE the deformity construct, move to the next higher deformity code (22802/22804) instead.');
    return;
  }
  if(!hasAnyFusionPrimary()){
    warn('+22614 is an add-on and cannot stand alone — no primary arthrodesis code is on this claim.');
    return;
  }
  addN('22614', n);
}

// Device (cage) count can never exceed the interspace count captured earlier (M3).
function addDevice(n){
  var max = S.lvl || 0;
  if(max > 0 && n > max){
    warn('Interbody device count reduced from '+n+' to '+max+'. You told this interview that '+max+' interspace(s) were fused, and +22853 is reported once per FUSED INTERSPACE — a device cannot be placed in an interspace that was not fused. Billing '+n+' units against '+max+' fused interspaces is an anatomically impossible claim and will be denied on level-of-service review. Go back and correct the interspace count if more levels were actually fused.');
    n = max;
  }
  addN('22853', n);
}

// Re-derives the posterior interbody primary/add-on set from the 360-vs-interbody-only
// mix across all fused interspaces. +22634 is the child of 22633 ONLY; +22632 is the
// child of 22630 OR 22633. Only ONE primary code is reportable per session (H3).
function setInterbodyMix(a360, aIB){
  var p360 = has('22633');
  var t360 = a360 + (p360 ? 1 : 0);
  var tIB  = aIB  + (p360 ? 0 : 1);
  remAll('22630'); remAll('22633');
  if(t360 > 0){
    addC('22633');
    addN('22634', t360 - 1);
    addN('22632', tIB);
    if(!p360){
      warn('Primary code re-derived to 22633. +22634 is an add-on to 22633 ONLY — it may not be reported with a 22630 primary. Because at least one interspace had a combined interbody AND posterolateral (360) arthrodesis, that interspace must carry the primary code (22633, the highest-work interspace); every interbody-only interspace is then reported as +22632. Document the 360 level explicitly so the primary code selection is supported.');
    }
  } else {
    addC('22630');
    addN('22632', tIB - 1);
  }
}

function go(id){ save(); S.step=id; draw(); }
function doC(codeOrNull, next){
  save();
  if(codeOrNull){
    var arr = Array.isArray(codeOrNull) ? codeOrNull : [codeOrNull];
    arr.forEach(function(c){ addC(c); });
  }
  S.step = next;
  draw();
}
function doN(id, n, next){ save(); addN(id,n); S.step=next; draw(); }
function goGraft(next){ save(); S.graftNext=next; S.step='graft'; S.gsel=[]; draw(); }

function toggleG(id){
  var btn = document.getElementById('gbtn_'+id);
  var i = S.gsel.indexOf(id);
  if(i >= 0){ S.gsel.splice(i,1); if(btn) btn.classList.remove('on'); }
  else       { S.gsel.push(id);   if(btn) btn.classList.add('on');    }
}

function confirmG(){
  save();
  if(!S.gsel.length) warn('No graft selected — if no graft was used, no graft code is needed.');
  S.gsel.forEach(function(sid){
    var o = GRAFTS.find(function(x){ return x.id===sid; });
    if(o) o.codes.forEach(function(c){
      if(has(c)) warn('+'+c+' was already on the claim and was not added a second time — every graft add-on in this family carries MUE 1 per session.');
      else addOnce(c);
    });
  });
  S.gsel = [];
  S.step = S.graftNext;
  draw();
}

function totalW(){ return S.codes.reduce(function(a,id){ return a+((DB[id]||{}).w||0); }, 0); }

// ── Rendering ──────────────────────────────────────────────────────────────
function draw(){ document.getElementById('root').innerHTML = render(); }

var CAT_NAMES = {ac:'Anterior cervical',pc:'Posterior cervical',al:'Anterior or lateral lumbar',
  at:'Anterior thoracic',pd:'Posterior TL decompression',pf:'Posterior TL fusion',si:'SI joint fusion'};

function backBtn(){
  return S.hist.length > 0 ? '<button class="back" onclick="back()">&#8592; Back</button>' : '';
}
function progLine(){
  return S.cat ? '<p class="prog">Category: '+CAT_NAMES[S.cat]+'</p>' : '';
}

function render(){
  if(S.step === 'cat')   return renderCat();
  if(S.step === 'graft') return renderGraft();
  if(S.step === 'done')  return renderDone();
  var fn = STEPS[S.step];
  if(!fn) return '<p style="color:#a3302d">Unknown step: '+S.step+'</p>';
  return backBtn() + progLine() + fn() + miniPanel();
}

function miniPanel(){
  if(!S.codes.length && !S.warns.length) return '';
  var rows = S.codes.map(function(id){
    var c=DB[id]||{}, w=c.w||0;
    return '<div class="row"><span class="cpt">'+(c.ao?'+':'')+id+'</span>'
          +'<span class="desc">'+(c.d||id)+'</span>'
          +'<span class="wrvu">'+w.toFixed(2)+' wRVU</span></div>';
  }).join('');
  var ws = S.warns.map(function(w){ return '<div class="warn">'+w+'</div>'; }).join('');
  return (rows ? '<div class="panel"><h3>Codes so far</h3>'+rows+'</div>' : '') + ws;
}

function renderCat(){
  var cats = [
    {id:'ac',label:'Anterior cervical',sub:'ACDF, disc replacement, adjacent level, revision'},
    {id:'pc',label:'Posterior cervical',sub:'Laminoplasty, fusion, decompression, upper cervical, ORIF'},
    {id:'al',label:'Anterior or lateral lumbar',sub:'ALIF, LLIF/XLIF/OLIF, lateral extracavitary, disc replacement'},
    {id:'at',label:'Anterior thoracic',sub:'Thoracic interbody, lateral extracavitary, corpectomy'},
    {id:'pd',label:'Posterior TL decompression',sub:'Laminectomy, microdiscectomy, laminotomy, tumor'},
    {id:'pf',label:'Posterior TL fusion',sub:'PLIF/TLIF, deformity/osteotomy, revision, pelvic fixation'},
    {id:'si',label:'SI joint fusion',sub:'MIS lateral, posterior approach, open, revision'},
  ];
  var btns = cats.map(function(c){
    return '<button class="btn" onclick="selCat(\''+c.id+'\')"><div style="font-weight:600;margin-bottom:2px">'+c.label+'</div>'
          +'<div style="font-size:12px;color:var(--muted)">'+c.sub+'</div></button>';
  }).join('');
  return '<p class="qlabel">What surgery was performed?</p><div class="cat-grid">'+btns+'</div>';
}

function selCat(id){
  save();
  S.cat=id; S.codes=[]; S.warns=[]; S.gsel=[];
  var first={ac:'ac1',pc:'pc1',al:'al1',at:'at1',pd:'pd1',pf:'pf1',si:'si1'};
  S.step = first[id];
  draw();
}

function renderGraft(){
  // The graft multi-select is the one step whose UI state lives outside the
  // rendered HTML (toggleG mutates the DOM directly). Any re-draw of this step —
  // including back() landing here from a later step — must start from a clean
  // selection or the restored S.gsel silently disagrees with the unlit buttons.
  S.gsel = [];
  var btns = GRAFTS.map(function(o){
    return '<button class="btn" id="gbtn_'+o.id+'" onclick="toggleG(\''+o.id+'\')">'+o.label+'</button>';
  }).join('');
  return backBtn() + progLine()
    + '<p class="qlabel">What bone graft was used?</p>'
    + '<p class="qhint">Select all that apply, then press confirm.</p>'
    + '<div class="grid">'+btns+'</div>'
    + '<button class="cbtn" onclick="confirmG()">Confirm selection &#8594;</button>'
    + miniPanel();
}

function renderDone(){
  var rows=S.codes.map(function(id){
    var c=DB[id]||{},w=c.w||0;
    return '<div class="row"><span class="cpt">'+(c.ao?'+':'')+id+'</span>'
          +'<span class="desc">'+(c.d||id)+'</span>'
          +'<span class="wrvu">'+w.toFixed(2)+' wRVU / $'+Math.round(w*CF).toLocaleString()+'</span></div>';
  }).join('');
  var onlyAddOns = S.codes.length > 0 && S.codes.every(function(id){ return (DB[id]||{}).ao; });
  var emptyWarn = '';
  if(!S.codes.length){
    emptyWarn = '<div class="warn">No billable code was captured on this path. Do NOT submit a $0 claim: go back and confirm the primary procedure was selected. If the case genuinely has no listed code, report the appropriate unlisted spine code (22899 spine, 63999 nervous system) by report, with the operative note and a comparison code.</div>';
  } else if(onlyAddOns){
    emptyWarn = '<div class="warn">This claim contains ONLY add-on codes. Add-on codes are never separately payable without their primary procedure and will be denied outright. Go back and add the primary arthrodesis, decompression, or corpectomy code that these add-ons attach to.</div>';
  }
  var ws=emptyWarn+S.warns.map(function(w){return '<div class="warn">'+w+'</div>';}).join('');
  var tw=totalW();
  var seen={};var tips=[];
  S.codes.forEach(function(id){
    if(OP_NOTES[id]&&!seen[id]){seen[id]=1;tips.push({id:id,tip:OP_NOTES[id]});}
  });
  var tipHtml='';
  if(tips.length>0){
    var tipRows=tips.map(function(t){
      return '<div style="padding:9px 0;border-bottom:1px solid var(--border)">'
        +'<div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:3px;font-family:ui-monospace,monospace">'+t.id+'</div>'
        +'<div style="font-size:12.5px;color:var(--muted);line-height:1.65">'+t.tip+'</div>'
        +'</div>';
    }).join('');
    tipHtml='<div class="panel" style="margin-top:1rem">'
      +'<h3>Operative note documentation tips</h3>'
      +'<p style="font-size:11.5px;color:var(--faint);margin-bottom:8px">Key elements to document for each billed code</p>'
      +tipRows+'</div>';
  }
  return backBtn()
    +'<h1 class="done-title">Case complete</h1>'
    +'<div class="panel"><h3>Billable code list</h3>'+(rows||'<p style="font-size:13px;color:var(--muted)">No codes selected.</p>')+'</div>'
    +ws
    +'<div class="tbar"><span class="tlabel">Total wRVUs</span><span class="tval">'+tw.toFixed(2)+'</span></div>'
    +'<div class="tbar"><span class="tlabel">Estimated Medicare physician payment (non-QPP $33.40/wRVU)</span><span class="tval">$'+Math.round(tw*CF).toLocaleString()+'</span></div>'
    +tipHtml
    +'<button class="restart" onclick="restart()" style="margin-top:1rem">Start new case</button>'
    +'<p class="note">2026 CMS PFS non-QPP CF $33.40. Physician facility rate shown. Add-on codes marked +. 0775T is Category III with variable payer coverage. Verify all codes with CMS PFS Lookup Tool for your MAC. Not billing or legal advice.</p>';
}

var LAST_OPTS = null; // most recent options list; also enables headless test driving
function q(label, opts, hint){
  LAST_OPTS = opts;
  var h = hint ? '<p class="qhint">'+hint+'</p>' : '';
  var btns = opts.map(function(o,i){
    return '<button class="btn" data-qi="'+i+'">'+o.label+'</button>';
  }).join('');
  setTimeout(function(){
    var wrap = document.getElementById('qwrap');
    if(!wrap) return;
    wrap.querySelectorAll('[data-qi]').forEach(function(b){
      b.addEventListener('click', function(){
        opts[parseInt(b.getAttribute('data-qi'))].fn();
      });
    });
  }, 0);
  return '<p class="qlabel">'+label+'</p>'+h+'<div class="grid" id="qwrap">'+btns+'</div>';
}

// Extension of a revision construct to previously unfused interspaces: the first
// new interspace needs a PRIMARY arthrodesis code when the claim has none yet,
// and every interspace after that takes +22614 (M8).
function addExtensionLevels(n){
  if(hasAnyFusionPrimary()){
    addExtraInterspace(n);
    warn('A primary arthrodesis code is already on this claim, so the '+n+' newly fused interspace(s) were billed as +22614 add-ons. Only one primary arthrodesis code is reportable per session.');
  } else {
    addC('22612');
    addExtraInterspace(n - 1);
    warn('22612 (posterolateral arthrodesis, lumbar, single interspace) was added as the primary code for the extension, with +22614 for each interspace beyond the first. If the extension was thoracic, change the primary to 22610; if an interbody cage was placed at the first new interspace, change it to 22630 or 22633.');
  }
}

  '22850': 'Removal of posterior NON-segmental instrumentation. Document the construct type explicitly (Harrington rod, single-interspace hook or screw-rod) and that it did not span three or more segments with fixation at each — that distinction is what separates 22850 from 22852.',
  '63015': 'Document complete laminectomy at MORE THAN 2 cervical segments, naming each segment, WITHOUT facetectomy or foraminotomy. Record bilateral canal decompression, ligamentum flavum resection, and dural pulsation restored at every level. The segment count is built into the code — there is no additional-segment add-on.',
  '63081': 'Document the anterior cervical corpectomy: the vertebral body resected, the extent of resection (partial vs complete), decompression of the cord and nerve roots confirmed, and the posterior longitudinal ligament handling. Record the reconstruction separately — the arthrodesis (22551/22554), the corpectomy-defect device (+22854), the plate (+22845/+22846), and the graft each carry their own code.',
  '63085': 'Document the TRANSTHORACIC approach explicitly (thoracotomy or VATS, rib resected, lung deflation) and the thoracic vertebral body resected with cord decompression confirmed. A combined thoracolumbar exposure in the same session is 63087 instead — the approach, not the level, selects the code.',
  '63032': 'Document the annular defect dimensions measured intraoperatively, the device brand and size, anchor placement into the adjacent vertebral bodies, and fluoroscopic confirmation of final position. Coverage is not universal — check your MAC LCD before submitting. Not reportable with 63042.',
  '22610': 'Document decortication of the thoracic facets, transverse processes, and lamina with graft placed in the posterolateral gutters bilaterally at the named interspace. Only ONE primary arthrodesis code is reportable per session — if the construct also crosses into the lumbar spine, those interspaces are +22614, not a second primary.',
  '22854': 'Document the device placed into a vertebral CORPECTOMY DEFECT: the resected body it spans, the cage/mesh brand and dimensions, endplate preparation above and below, graft packed into the device, and fluoroscopic confirmation. This is a different service from +22853 (device into a disc INTERSPACE) — a claim that reports +22854 must also carry a corpectomy code.',
  '22852': 'Document each implant removed by level and type. Describe prior fusion mass integrity. Record whether pseudarthrosis was identified. Note explant technique for each anchor.',
  '22600': 'Document lateral mass or pedicle screw placement at each instrumented level. Record decortication of facets and transverse processes. Document graft placed in posterolateral gutters bilaterally. Confirm hardware position on intraoperative imaging.',
  '22595': 'Document C1 lateral mass and C2 pedicle or isthmus screw technique. Record atlantoaxial reduction confirmed intraoperatively. Document graft placement and fluoroscopic or navigation confirmation.',
  '22590': 'Document occipital plate positioning, keel depth, and screw fixation into occiput. Record subaxial extension levels. Document craniocervical junction alignment and intraoperative imaging confirmation.',
  '22532': 'Document the lateral extracavitary corridor explicitly (paraspinal mobilization, rib head/transverse process exposure as applicable). Record interspace preparation and graft placement for each segment. Each additional contiguous segment (+22534) must be individually described.',
  '63001': 'Document complete laminectomy with full lamina removed at each level, WITHOUT facetectomy or foraminotomy. Record bilateral decompression of spinal canal. Note ligamentum flavum resected. Confirm dural pulsation restored post-decompression.',
  '63020': 'Document hemilaminotomy only — not complete laminectomy. Record ipsilateral ligamentum flavum removal, nerve root visualization, foramen decompression confirmed, and absence of dural tear.',

  '63047': 'Document complete lumbar laminectomy at the named segment PLUS medial facetectomy and foraminotomy with nerve root decompression. When billed with a fusion, the decompression level must be DISTINCT from the interbody interspace (append XS/59); same-interspace decompression with PLIF/TLIF uses +63052 instead.',

  '63052': 'Document decompression at the fusion interspace BEYOND what interbody access requires: bilateral canal decompression, dural exposure, ligamentum flavum resection, and nerve root decompression described as a distinct step from cage-corridor preparation. This add-on (CPT 2022) replaces 63047 at the fused level.',
  '63050': 'Document laminoplasty technique (open-door or French-door). Record hinge creation and opening dimension. If 63051 billed, document plate and spacer placement. Confirm canal decompression and preservation of posterior elements.',

  '63042': 'Document prior surgical scar at level, epidural adhesions encountered, careful dissection technique to avoid dural injury, recurrent disc material identified and removed, nerve root decompressed.',
  '63012': 'Document spondylolisthesis grade, cauda equina involvement, complete laminectomy, bilateral foraminotomy, and adequate canal decompression confirmed.',
  '63087': 'Document BOTH exposures explicitly — this code describes a COMBINED thoracolumbar approach (anterior/transthoracic plus posterior or retroperitoneal) performed in one session for a lower thoracic or lumbar segment, and the combined exposure is what earns the 36.59 wRVU. A single-corridor transthoracic corpectomy is 63085 instead. Record the extent of vertebral body resection, cord/cauda equina decompression confirmed, and anterior column reconstruction with cage dimensions and graft material (+22854 for the corpectomy-defect device).',
  '22558': 'Document the specific approach used: ALIF retroperitoneal, ALIF transperitoneal, lateral retroperitoneal (LLIF/XLIF/OLIF), or prone lateral/PTP. All use 22558 regardless of approach route. Record annulotomy and complete discectomy, endplate preparation to bleeding bone, cage brand and dimensions, graft material, and fluoroscopic AP and lateral confirmation of cage position. If a separate access/vascular surgeon provided the approach, note this explicitly to support Mod 62 billing for both surgeons. Modifier 51 note: add-on codes billed with 22558 (such as +22585, +22853, +22845) never receive Mod 51. If 22558 is billed alongside a separate standalone procedure such as posterior fusion (22612) in the same session, apply Mod 51 to the lower-wRVU standalone code.',
  '22586': 'Document presacral approach technique, axial cannulation, discectomy and endplate preparation, implant sizing confirmed, and biplanar fluoroscopic confirmation of final implant position.',

  '22612': 'Document decortication of facets, transverse processes, and pars bilaterally. Record graft placed in posterolateral gutters. Note screw-rod construct placement and intraoperative imaging confirming alignment and hardware position.',

  '22214': 'Document pedicle subtraction osteotomy technique including pedicle removal, lateral vertebral wall osteotomy, posterior vertebral wall resection, and anterior column closure. Record sagittal correction achieved in degrees. Document neuromonitoring baseline and post-closure signals.',
  '22212': 'Document thoracic SPO or PSO technique, posterior column shortening at the specified vertebra, degree of correction achieved, osteotomy closure confirmed by fluoroscopy, and neuromonitoring signals stable throughout.',
  '27279': 'Document SIJ pathology confirmed by preoperative provocative testing and diagnostic injection. Record lateral positioning, fluoroscopic guide pin placement confirmed on AP, inlet, and outlet views. Document implant brand, size, and number placed. Confirm final position on all three fluoroscopic projections. Bilateral: one line with Mod 50.',
  '27280': 'Document posterior approach to SIJ, joint exposure, cartilage removal and joint surface preparation, bone graft placed, hardware fixation across joint, and fluoroscopic confirmation of final position.',

  '20930': 'Medicare assigns $0 wRVU to 20930 (morselized allograft) — no physician payment under Medicare PFS. Always submit to commercial payers as payment policies vary and many commercial plans reimburse. Document allograft brand and lot number, volume placed, and that it was morselized (not structural) graft material.',
  '20936': 'Medicare assigns $0 wRVU to 20936 (local autograft same incision) — no physician payment under Medicare PFS. Submit to commercial payers; many reimburse for this code. Document that graft material was harvested from the same incision as the primary procedure (spinous process, lamina, or local posterior elements). Specify volume harvested and that no separate incision was made.',
